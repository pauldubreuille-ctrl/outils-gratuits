
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Administration | Outils Gratuits</title>
  <style>
    :root {
      font-family: Inter, system-ui, Arial, sans-serif;
      color: #17243b;
      background: #f4f7fc;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header {
      background: #14284a;
      color: white;
      padding: 22px 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
    }
    header h1 { margin: 0; font-size: 22px; }
    header a { color: white; text-decoration: none; }
    main { max-width: 1150px; margin: 35px auto; padding: 0 20px; }
    h2 { margin-top: 0; }
    .panel {
      background: white;
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 24px;
      box-shadow: 0 5px 25px #14284a0c;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 24px;
    }
    .stat {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 5px 25px #14284a0c;
    }
    .stat strong { display: block; font-size: 30px; margin-top: 8px; }
    .stat span { color: #60708a; }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 7px;
    }
    input, textarea, select {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      padding: 12px;
      font: inherit;
      background: white;
      color: #17243b;
    }
    textarea { min-height: 90px; resize: vertical; }
    .field { margin-bottom: 16px; }
    button {
      background: #2563eb;
      border: 0;
      border-radius: 9px;
      padding: 11px 16px;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { filter: brightness(.93); }
    button:disabled { opacity: .5; cursor: wait; }
    .secondary { background: #64748b; }
    .danger { background: #dc2626; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .table-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; }
    th, td {
      padding: 13px;
      border-bottom: 1px solid #e2e8f0;
      text-align: left;
    }
    th { color: #64748b; font-size: 13px; }
    .pill {
      border-radius: 20px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 700;
    }
    .active { background: #dcfce7; color: #166534; }
    .inactive { background: #fee2e2; color: #991b1b; }
    #message {
      padding: 14px;
      border-radius: 9px;
      margin-bottom: 20px;
      display: none;
      overflow-wrap: anywhere;
    }
    .success { background: #dcfce7; color: #166534; }
    .error { background: #fee2e2; color: #991b1b; }
    .muted { color: #64748b; }
    @media(max-width: 700px) {
      .grid, .stats { grid-template-columns: 1fr; }
      main { margin-top: 20px; }
      .panel { padding: 18px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>⚙️ Outils Gratuits — Administration</h1>
    <a href="/">← Retour au site</a>
  </header>

  <main>
    <div id="message" role="alert" aria-live="polite"></div>

    <section class="stats">
      <div class="stat">
        <span>Total des outils</span>
        <strong id="total">—</strong>
      </div>
      <div class="stat">
        <span>Outils actifs</span>
        <strong id="enabled">—</strong>
      </div>
      <div class="stat">
        <span>Outils désactivés</span>
        <strong id="disabled">—</strong>
      </div>
    </section>

    <section class="panel">
      <h2 id="formTitle">Ajouter un outil</h2>
      <p class="muted">
        Gère les fiches des outils enregistrés dans ta base D1.
      </p>

      <form id="toolForm">
        <div class="grid">
          <div class="field">
            <label for="name">Nom de l'outil</label>
            <input id="name" required maxlength="120"
                   placeholder="Calculateur de TVA">
          </div>
          <div class="field">
            <label for="slug">Identifiant unique</label>
            <input id="slug" required
                   pattern="[a-z0-9-]{2,80}"
                   placeholder="calculateur-tva">
          </div>
          <div class="field">
            <label for="category">Catégorie</label>
            <select id="category" required>
              <option value="">Choisir une catégorie</option>
              <option value="finance">Finance</option>
              <option value="immobilier">Immobilier</option>
              <option value="travail">Travail</option>
              <option value="entreprise">Entreprise</option>
              <option value="maison">Maison</option>
              <option value="sante">Santé</option>
              <option value="education">Éducation</option>
              <option value="technologie">Technologie</option>
              <option value="voyage">Voyage</option>
              <option value="quotidien">Vie quotidienne</option>
            </select>
          </div>
          <div class="field">
            <label for="active">Statut</label>
            <select id="active">
              <option value="1">Actif</option>
              <option value="0">Désactivé</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="description">Description</label>
          <textarea id="description"
            placeholder="Description de l'outil"></textarea>
        </div>

        <div class="field">
          <label for="config">Configuration JSON</label>
          <textarea id="config" spellcheck="false">{}</textarea>
          <p class="muted">
            Pour commencer, laisse simplement {}.
          </p>
        </div>

        <div class="actions">
          <button id="saveButton" type="submit">
            Enregistrer l'outil
          </button>
          <button class="secondary" id="cancelButton"
                  type="button" hidden>
            Annuler la modification
          </button>
        </div>
      </form>
    </section>

    <section class="panel">
      <div class="actions" style="justify-content:space-between">
        <h2>Mes outils</h2>
        <button class="secondary" id="refreshButton">
          Actualiser
        </button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Nom</th>
              <th>Catégorie</th>
              <th>Statut</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="toolsBody">
            <tr><td colspan="4">Chargement...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    let tools = [];
    let editingId = null;

    function showMessage(text, type = "success") {
      const box = $("message");
      box.textContent = text;
      box.className = type;
      box.style.display = "block";
    }

    async function api(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        credentials: "same-origin",
        headers: {
          "Content-Type": "application/json",
          ...(options.headers || {})
        }
      });

      const contentType = response.headers.get("content-type") || "";

      if (!contentType.includes("application/json")) {
        throw new Error(
          "Réponse inattendue. Vérifie ta connexion Cloudflare Access."
        );
      }

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "Erreur HTTP " + response.status);
      }

      return data;
    }

    async function loadTools() {
      try {
        tools = await api("/api/admin/tools");
        renderTools();
      } catch (error) {
        $("toolsBody").replaceChildren();
        const tr = document.createElement("tr");
        const td = document.createElement("td");
        td.colSpan = 4;
        td.textContent = "Erreur : " + error.message;
        tr.appendChild(td);
        $("toolsBody").appendChild(tr);
        showMessage(error.message, "error");
      }
    }

    function renderTools() {
      $("total").textContent = tools.length;
      $("enabled").textContent =
        tools.filter(t => Number(t.active) === 1).length;
      $("disabled").textContent =
        tools.filter(t => Number(t.active) !== 1).length;

      const body = $("toolsBody");
      body.replaceChildren();

      if (!tools.length) {
        const tr = document.createElement("tr");
        const td = document.createElement("td");
        td.colSpan = 4;
        td.textContent = "Aucun outil enregistré pour le moment.";
        tr.appendChild(td);
        body.appendChild(tr);
        return;
      }

      for (const tool of tools) {
        const tr = document.createElement("tr");

        const name = document.createElement("td");
        name.textContent = tool.name;

        const category = document.createElement("td");
        category.textContent = tool.category;

        const status = document.createElement("td");
        const pill = document.createElement("span");
        const isActive = Number(tool.active) === 1;
        pill.className = "pill " + (isActive ? "active" : "inactive");
        pill.textContent = isActive ? "Actif" : "Désactivé";
        status.appendChild(pill);

        const actions = document.createElement("td");
        actions.className = "actions";

        const edit = document.createElement("button");
        edit.textContent = "Modifier";
        edit.addEventListener("click", () => editTool(tool));

        const disable = document.createElement("button");
        disable.className = "danger";
        disable.textContent = "Désactiver";
        disable.disabled = !isActive;
        disable.addEventListener("click", () => disableTool(tool));

        actions.append(edit, disable);
        tr.append(name, category, status, actions);
        body.appendChild(tr);
      }
    }

    function editTool(tool) {
      editingId = tool.id;
      $("formTitle").textContent = "Modifier un outil";
      $("name").value = tool.name;
      $("slug").value = tool.slug;
      $("slug").disabled = true;
      $("category").value = tool.category;
      $("description").value = tool.description || "";
      $("active").value = String(tool.active);
      $("config").value = tool.config_json || "{}";
      $("saveButton").textContent = "Enregistrer les modifications";
      $("cancelButton").hidden = false;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function resetForm() {
      editingId = null;
      $("toolForm").reset();
      $("slug").disabled = false;
      $("config").value = "{}";
      $("formTitle").textContent = "Ajouter un outil";
      $("saveButton").textContent = "Enregistrer l'outil";
      $("cancelButton").hidden = true;
    }

    async function disableTool(tool) {
      if (!confirm("Désactiver " + tool.name + " ?")) return;

      try {
        await api("/api/admin/tools/" + tool.id, {
          method: "DELETE"
        });
        showMessage("Outil désactivé.");
        await loadTools();
      } catch (error) {
        showMessage(error.message, "error");
      }
    }

    $("toolForm").addEventListener("submit", async event => {
      event.preventDefault();

      let config;

      try {
        config = JSON.parse($("config").value);

        if (
          config === null ||
          typeof config !== "object" ||
          Array.isArray(config)
        ) {
          throw new Error("La configuration doit être un objet JSON.");
        }
      } catch {
        showMessage("Configuration JSON invalide.", "error");
        return;
      }

      const data = {
        name: $("name").value.trim(),
        category: $("category").value,
        description: $("description").value,
        config,
        active: Number($("active").value)
      };

      if (editingId === null) {
        data.slug = $("slug").value.trim();
      }

      const button = $("saveButton");
      button.disabled = true;

      try {
        if (editingId === null) {
          await api("/api/admin/tools", {
            method: "POST",
            body: JSON.stringify(data)
          });
          showMessage("Outil créé avec succès !");
        } else {
          await api("/api/admin/tools/" + editingId, {
            method: "PUT",
            body: JSON.stringify(data)
          });
          showMessage("Outil modifié avec succès !");
        }

        resetForm();
        await loadTools();
      } catch (error) {
        showMessage(error.message, "error");
      } finally {
        button.disabled = false;
      }
    });

    $("cancelButton").addEventListener("click", resetForm);
    $("refreshButton").addEventListener("click", loadTools);

    loadTools();
  </script>
</body>
</html>
